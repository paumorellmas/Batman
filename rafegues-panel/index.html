<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="row dest">
      <label>Vídeo</label>
      <select id="vDest"></select>
      <label>Àudio</label>
      <select id="aDest"></select>
      <button id="refresh" class="icon" title="Actualitza les pistes de la seqüència">⟳</button>
    </div>

    <div id="list"></div>
    <div id="empty" class="hint">
      Encara no tens cap ràfega.<br>
      Munta-la una vegada a la timeline (vídeo + so), selecciona els dos clips i prem
      <b>Desa la selecció</b>.
    </div>

    <button id="capture" class="primary">+ Desa la selecció com a ràfega</button>

    <div class="row opts">
      <label class="check"><input type="checkbox" id="moveAfter"> Mou el cursor al final</label>
    </div>
    <div class="row opts">
      <button id="export" class="small">Exporta</button>
      <button id="import" class="small">Importa</button>
    </div>

    <div id="status" class="status"></div>
    <div class="hint small-hint">
      Les tecles funcionen quan el panell té el focus: fes clic al fons del panell (no a un camp de text).
    </div>
  </div>
  <script src="index.js"></script>
</body>
</html>
