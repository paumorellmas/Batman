<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="bar">
      <span class="barLabel">Destí</span>
      <select id="vDest" title="Pista de vídeo de destí"></select>
      <select id="aDest" title="Pista d'àudio de destí"></select>
      <div id="refresh" class="iconBtn" title="Actualitza el projecte i les pistes">⟳</div>
    </div>

    <div class="section">
      <div class="sectionHead">
        <span class="sectionTitle">TOTS ELS PROJECTES</span>
        <div id="captureGlobal" class="add" title="Desa els clips seleccionats com a ràfega per a tots els projectes">+ Desa la selecció</div>
      </div>
      <div id="listGlobal"></div>
      <div id="emptyGlobal" class="empty">
        Munta la ràfega a la timeline (vídeo + so), selecciona els dos clips i prem «+ Desa la selecció».
      </div>
    </div>

    <div class="section">
      <div class="sectionHead">
        <span class="sectionTitle">AQUEST PROJECTE</span>
        <span id="projectName" class="projectName"></span>
        <div id="captureProject" class="add" title="Desa els clips seleccionats com a ràfega només d'aquest projecte">+ Desa la selecció</div>
      </div>
      <div id="listProject"></div>
      <div id="emptyProject" class="empty"></div>
      <div id="others" class="link"></div>
      <div id="listOthers"></div>
    </div>

    <div class="footer">
      <label class="check"><input type="checkbox" id="moveAfter"> Mou el cursor al final</label>
      <div class="footerBtns">
        <div id="export" class="chip">Exporta</div>
        <div id="import" class="chip">Importa</div>
      </div>
    </div>

    <div id="status" class="status"></div>
    <div class="note">Les tecles funcionen quan el panell té el focus: fes clic al fons del panell.</div>
  </div>
  <script src="index.js"></script>
</body>
</html>
